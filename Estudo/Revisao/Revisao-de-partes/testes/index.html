<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site De Teste</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/9675944a91.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <div class="header__container">
            <a href="#" class="header__logo">Meu site</a>

            
            <button class="header__menu-btn" type="button" aria-label="Abrir menu" aria-expanded="false" data-menu-btn>
                <span class="fa-solid fa-bars header__icon-bars"></span>
                <span class="fa-solid fa-xmark header__icon-close"></span>
            </button>

            <nav class="header__nav" id="menu-navegacao" aria-label="Navegação Principal" data-menu-nav>
                <ul class="header__menu">
                    <li class="header__item"><a href="#" class="header__link header__link--active">Início</a></li>
                    <li class="header__item"><a href="#" class="header__link">Sobre</a></li>
                    <li class="header__item"><a href="#" class="header__link">Serviços</a></li>
                    <li class="header__item"><a href="#" class="header__link">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>






    <script src="script.js"></script>
</body>
</html>
